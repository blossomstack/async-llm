[package]
name = "async-llm"
version = "0.10.0"
edition = "2021"
authors = ["Timon Vonk <timon@bosun.ai>"]
license = "MIT"
homepage = "https://github.com/blossomstack/async-llm"
repository = "https://github.com/blossomstack/async-llm"
categories = ["api-bindings", "web-programming", "asynchronous"]
keywords = ["llm", "anthropic", "ai", "gpt", "claude"]
description = "Async Rust client for LLM APIs - Anthropic Messages API today; fork of async-anthropic with thinking-block and prompt-cache support."
readme = "README.md"

[dependencies]
thiserror = "2.0"
reqwest = { version = "0.12", features = ["json", "stream"], default-features = false }
reqwest-eventsource = "0.6.0"
serde = { version = "1.0", features = ["derive"], default-features = false }
serde_json = { version = "1.0", default-features = false }
derive_builder = "0.20.2"
tracing = "0.1.41"
secrecy = "0.10.3"
backoff = { version = "0.4", features = ["futures", "tokio"] }
tokio-stream = { default-features = false, version = "0.1.14" }
tokio = { version = "1", default-features = false, features = ["time"] }
async-stream = { version = "0.3", optional = true }
async-trait = "0.1.88"
base64 = "0.23"
axum = { version = "0.8", optional = true }
futures = { version = "0.3", optional = true }
parking_lot = { version = "0.12", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[[bin]]
name = "async-llm-mock"
path = "src/bin/async-llm-mock.rs"
required-features = ["mock"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
wiremock = "0.6.3"
async-trait = "0.1.88"
test-log = "0.2.17"

[features]
# By default, enable Anthropic support and use reqwest with rustls.
default = ["anthropic", "rustls"]
anthropic = []
openai = ["dep:async-stream"]
responses = ["openai"]
mock = [
    "anthropic",
    "openai",
    "responses",
    "dep:axum",
    "dep:futures",
    "dep:parking_lot",
    "dep:uuid",
    "tokio/macros",
    "tokio/net",
    "tokio/rt-multi-thread",
    "tokio/sync",
]

# Enables TLS functionality provided by rustls, while using root certificates from the rustls-native-certs crate.
rustls = ["reqwest/rustls-tls-native-roots"]

# Enables TLS functionality provided by native-tls
native-tls = ["reqwest/native-tls"]
